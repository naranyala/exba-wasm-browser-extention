<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>EXBA Sidebar Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        padding: 12px;
        align-items: stretch;
      }
    </style>
  </head>
  <body class="sidepanel-body">
    <div class="container" style="background: transparent; border: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; padding: 0; height: auto;">
      <div style="margin-bottom: 12px;">
        <h1>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="color: #a5b4fc"
          >
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="M9 3v18" />
          </svg>
          EXBA Sidebar
        </h1>
        <div class="subtitle" style="margin-bottom: 12px;">Unified Wasm Dashboard</div>
      </div>

      <!-- Dashboard Web Component -->
      <wasm-dashboard title="Sidebar Dashboard"></wasm-dashboard>
    </div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
